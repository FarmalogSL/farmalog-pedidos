<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Farmalog · Pedidos Transfer</title><style>*{box-sizing:border-box}body{margin:0;font:14px Arial;background:#f5f7fa;color:#172033}aside{position:fixed;width:230px;height:100vh;background:#0d2742;color:white;padding:24px}main{margin-left:230px;padding:28px}.brand{font-size:24px;font-weight:700}.muted{color:#9aa8b7;font-size:12px}button{border:0;border-radius:10px;padding:10px 14px;cursor:pointer}.nav{display:block;width:100%;text-align:left;margin:8px 0;background:transparent;color:white}.nav:hover,.primary{background:#1686b8;color:white}.card{background:white;padding:20px;border-radius:16px;margin-bottom:16px;box-shadow:0 2px 12px #0000000b}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}input,select{width:100%;padding:10px;border:1px solid #dce2e8;border-radius:9px;margin-top:5px}.row{padding:12px;border-top:1px solid #edf0f3;display:grid;grid-template-columns:1fr 2fr 1fr 1fr;gap:12px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.hide{display:none}h1{margin-top:0}</style></head><body><aside><div class="brand">FARMALOG</div><div class="muted">Pedidos Transfer</div><br><button class="nav" onclick="show('resumen')">Resumen</button><button class="nav" onclick="show('nuevo')">Nuevo pedido</button><button class="nav" onclick="show('pedidos')">Pedidos</button></aside><main><section id="resumen"><h1>Resumen</h1><div class="kpis"><div class="card"><span>Pedidos guardados</span><h2 id="nPedidos">0</h2></div><div class="card"><span>Pendientes</span><h2 id="nPend">0</h2></div><div class="card"><span>Importe acumulado</span><h2 id="total">0,00 €</h2></div></div></section><section id="nuevo" class="hide"><h1>Nuevo pedido</h1><div class="card"><h3>Cabecera</h3><div class="grid"><label>Nombre farmacia<input id="nombre"></label><label>CIF<input id="cif"></label><label>Código Mayorista<input id="codigoMayorista"></label><label>Nº Pedido Laboratorio<input id="numeroPedido"></label><label>Laboratorio<input id="laboratorio" value="HALEON SPAIN S.A."></label><label>CIF Laboratorio<input id="cifLab" value="A28738458"></label><label>Fecha pedido<input id="fecha" type="date"></label><label>Mayorista<input id="mayorista"></label><label>CIF Mayorista<input id="cifMayorista"></label></div></div><div class="card"><h3>Artículo</h3><div class="grid"><label>Cod. EAN/Nacional<input id="ean"></label><label>Descripción<input id="desc"></label><label>Unidades<input id="uds" type="number"></label><label>Uds. bonificadas<input id="boni" type="number"></label><label>Precio base<input id="precio" type="number" step=".01"></label><label>Descuento %<input id="dto" type="number" step=".01"></label></div><p><button class="primary" onclick="addLinea()">Añadir artículo</button></p><div id="lineas"></div><p><b>Total: <span id="totalActual">0,00 €</span></b></p><button class="primary" onclick="guardar()">Guardar pedido</button></div></section><section id="pedidos" class="hide"><h1>Pedidos</h1><div class="card" id="lista"></div></section></main><script>let actuales=[];let pedidos=JSON.parse(localStorage.getItem('farmalog_pedidos')||'[]');const e=id=>document.getElementById(id);function show(id){['resumen','nuevo','pedidos'].forEach(x=>e(x).classList.toggle('hide',x!==id));render()}function eur(n){return Number(n||0).toLocaleString('es-ES',{style:'currency',currency:'EUR'})}function subtotal(l){return (+l.uds||0)*(+l.precio||0)*(1-(+l.dto||0)/100)}function addLinea(){if(!e('ean').value||!e('uds').value)return;actuales.push({ean:e('ean').value,desc:e('desc').value,uds:e('uds').value,boni:e('boni').value,precio:e('precio').value,dto:e('dto').value});['ean','desc','uds','boni','precio','dto'].forEach(x=>e(x).value='');renderLineas()}function renderLineas(){e('lineas').innerHTML=actuales.map((l,i)=>`<div class="row"><b>${l.ean}</b><span>${l.desc}</span><span>${l.uds} uds.</span><span>${eur(subtotal(l))}</span></div>`).join('');e('totalActual').textContent=eur(actuales.reduce((s,l)=>s+subtotal(l),0))}function guardar(){if(!e('nombre').value||!e('cif').value||!e('mayorista').value||!actuales.length){alert('Completa farmacia, CIF, mayorista y al menos un artículo.');return}let cab={nombre:e('nombre').value,cif:e('cif').value,codigoMayorista:e('codigoMayorista').value,numeroPedido:e('numeroPedido').value,laboratorio:e('laboratorio').value,cifLab:e('cifLab').value,fecha:e('fecha').value,mayorista:e('mayorista').value,cifMayorista:e('cifMayorista').value};pedidos.unshift({id:'PED-'+String(Date.now()).slice(-6),cab,lineas:actuales,total:actuales.reduce((s,l)=>s+subtotal(l),0),estado:'Pendiente'});localStorage.setItem('farmalog_pedidos',JSON.stringify(pedidos));actuales=[];alert('Pedido guardado en este navegador.');show('pedidos')}function render(){e('nPedidos').textContent=pedidos.length;e('nPend').textContent=pedidos.filter(p=>p.estado==='Pendiente').length;e('total').textContent=eur(pedidos.reduce((s,p)=>s+p.total,0));e('lista').innerHTML=pedidos.length?pedidos.map(p=>`<div class="row"><b>${p.id}</b><span>${p.cab.nombre}</span><span>${p.cab.mayorista}</span><span>${eur(p.total)}</span></div>`).join(''):'Aún no hay pedidos.'}render();</script></body></html>
